name: Generate Snake Animation

on:
  # 每天 UTC 16:13 自动刷新（约北京时间次日 00:13）
  schedule:
    - cron: "13 16 * * *"
  # 手动触发
  workflow_dispatch:
  # 首次配置时自动跑一次
  push:
    branches:
      - master
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Generate snake SVG from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-snake.svg
            output/github-snake-dark.svg?palette=github-dark

      - name: ✅ Commit the generated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update github-snake contribution animation 🐍"
          file_pattern: "output/*.svg"
